<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Etiqueta - {{ item.nome }}</title>
  <style>
    @page {
      size: 80mm 40mm;
      margin: 0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .etiqueta {
      width: 80mm;
      height: 40mm;
      padding: 3mm;
      display: flex;
      align-items: center;
      gap: 4mm;
      border: 1px dashed #ccc;
    }

    .qrcode {
      flex-shrink: 0;
      border: 1px solid #ddd;
      padding: 2mm;
      background: white;
    }

    .info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .codigo {
      font-weight: bold;
      font-size: 11pt;
      font-family: 'Courier New', monospace;
      margin-bottom: 2mm;
    }

    .nome {
      font-size: 9pt;
      font-weight: 600;
      margin-bottom: 1mm;
      line-height: 1.2;
    }

    .detalhes {
      font-size: 7pt;
      color: #555;
      line-height: 1.3;
    }

    .almox {
      margin-top: 1mm;
      font-size: 6.5pt;
      color: #666;
      font-weight: 500;
    }

    @media print {
      body { margin: 0; }
      .etiqueta { border: none; }
    }
  </style>
</head>
<body>
  <div class="etiqueta">
    <div class="qrcode">
      <img src="{% url 'estoque:item_qrcode' item.pk %}"
           width="90" height="90" alt="QR Code">
    </div>
    <div class="info">
      <div class="codigo">{{ item.codigo_interno }}</div>
      <div class="nome">{{ item.nome|truncatechars:45 }}</div>
      <div class="detalhes">
        {{ item.categoria.nome }} • {{ item.get_unidade_medida_display }}
        {% if item.lote %}• Lote: {{ item.lote }}{% endif %}
      </div>
      <div class="almox">
        <strong>Almoxarifado:</strong> {{ item.almoxarifado.nome }}
      </div>
    </div>
  </div>

  <script>
    // Auto-print ao carregar
    window.onload = function() {
      window.print();
    };
  </script>
</body>
</html>

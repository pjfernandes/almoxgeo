<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    {% for crumb in breadcrumbs %}
    <li class="breadcrumb-item {% if forloop.last %}active{% endif %}">
      {% if forloop.last %}
      <i class="bi bi-{{ crumb.icon }} me-1" style="font-size:0.85rem; opacity:0.7;"></i>
      <span style="font-weight:500;">{{ crumb.title }}</span>
      {% else %}
      <a href="{{ crumb.url }}">{{ crumb.title }}</a>
      {% endif %}
    </li>
    {% endfor %}
  </ol>
</nav>

<style>
  .breadcrumb-item.active {
    color: #003366;
  }
</style>
